name: Build Custom Surya Kernel with Realtek Support

on:
  workflow_dispatch: # Allows manual trigger via the GitHub Actions UI button

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Your Forked Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Maximize Disk Space
        uses: tlaloc-kl/maximize-build-space@v7
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Install Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev lzop xz-utils curl libncurses5-dev

      - name: Inject Realtek Drivers And Wireless Subsystems
        run: |
          # Split variables to bypass text-wrapping bugs completely
          DRV_HOST="https://github.com"
          DRV_PATH="kimocoder/realtek_rtwifi.git"
          FULL_DRV_URL="${DRV_HOST}/${DRV_PATH}"
          
          # 1. Download a stable, Linux 4.14-compatible Realtek RTL88xx source tree
          git clone "$FULL_DRV_URL" --depth=1 drivers/net/wireless/realtek/rtl88xx
          
          # 2. Wire the driver into the compilation maps
          echo 'source "drivers/net/wireless/realtek/rtl88xx/Kconfig"' >> drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_RTL88XXAU) += realtek/rtl88xx/' >> drivers/net/wireless/Makefile
          
          # 3. Find the config file path dynamically and save it to global GitHub environment memory
          TARGET_CONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          CONFIG_NAME=$(basename "$TARGET_CONFIG")
          
          # Export to $GITHUB_ENV so subsequent workflow steps can read the variable
          echo "TARGET_CONFIG_NAME=$CONFIG_NAME" >> $GITHUB_ENV
          
          # 4. Append ALL necessary Wi-Fi & USB host power settings into that discovered target file
          echo "CONFIG_WIRELESS=y" >> "$TARGET_CONFIG"
          echo "CONFIG_CFG80211=y" >> "$TARGET_CONFIG"
          echo "CONFIG_MAC80211=y" >> "$TARGET_CONFIG"
          echo "CONFIG_CFG80211_WEXT=y" >> "$TARGET_CONFIG"
          echo "CONFIG_MAC80211_RC_MINSTREL_HT=y" >> "$TARGET_CONFIG"
          echo "CONFIG_USB_SUPPORT=y" >> "$TARGET_CONFIG"
          echo "CONFIG_USB_OTG=y" >> "$TARGET_CONFIG"
          echo "CONFIG_USB_NET_DRIVERS=y" >> "$TARGET_CONFIG"
          echo "CONFIG_RTL88XXAU=y" >> "$TARGET_CONFIG"
          echo "CONFIG_WIRELESS_EXT=y" >> "$TARGET_CONFIG"
          echo "CONFIG_WEXT_CORE=y" >> "$TARGET_CONFIG"
          echo "CONFIG_FW_LOADER=y" >> "$TARGET_CONFIG"
          echo "CONFIG_FIRMWARE_IN_KERNEL=y" >> "$TARGET_CONFIG"
          echo "CONFIG_EXTRA_FIRMWARE=\"\"" >> "$TARGET_CONFIG"

      - name: Download AOSP Clang Compiler Toolchain
        run: |
          # Split variables to bypass toolchain link-breaking bugs completely
          CLANG_HOST="https://googlesource.com"
          CLANG_PATH="platform/prebuilts/clang/host/linux-x86"
          FULL_CLANG_URL="${CLANG_HOST}/${CLANG_PATH}"
          
          git clone "$FULL_CLANG_URL" --depth=1 -b master ../aosp-clang

      - name: Trigger Kernel Compilation Process
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/../aosp-clang/clang-r522817/bin:$PATH"
          
          # Initialize setup using the configuration name saved in global environment memory
          make O=out "$TARGET_CONFIG_NAME"
          
          # Compile using all available virtual cores
          make -j$(nproc --all) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Finished Kernel Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surya-Custom-Kernel
          path: out/arch/arm64/boot/Image.gz-dtb
