name: Build Custom Surya Kernel with Realtek Support

on:
  workflow_dispatch: # Allows manual trigger via the GitHub Actions UI button

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Your Forked Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@main
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Install Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev lzop xz-utils curl libncurses5-dev

      - name: Inject Realtek Drivers And Wireless Subsystems
        run: |
          # Define URL pieces separately to prevent text formatting issues
          URL_BASE="https://github.com"
          URL_PATH="kimocoder/realtek_rtwifi.git"
          FULL_URL="${URL_BASE}/${URL_PATH}"
          
          # 1. Download a stable, Linux 4.14-compatible Realtek RTL88xx source tree
          git clone "$FULL_URL" --depth=1 drivers/net/wireless/realtek/rtl88xx
          
          # 2. Wire the driver into the compilation maps
          echo 'source "drivers/net/wireless/realtek/rtl88xx/Kconfig"' >> drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_RTL88XXAU) += realtek/rtl88xx/' >> drivers/net/wireless/Makefile
          
          # 3. Add ALL necessary Wi-Fi & USB host power settings to the defconfig target file
          echo "CONFIG_WIRELESS=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_CFG80211_WEXT=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_MAC80211_RC_MINSTREL_HT=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_USB_SUPPORT=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_USB_OTG=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_USB_NET_DRIVERS=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_RTL88XXAU=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_WIRELESS_EXT=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_WEXT_CORE=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_FW_LOADER=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_FIRMWARE_IN_KERNEL=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_EXTRA_FIRMWARE=\"\"" >> arch/arm64/configs/surya_defconfig

      - name: Download AOSP Clang Compiler Toolchain
        run: |
          git clone https://googlesource.com --depth=1 -b master ../aosp-clang

      - name: Trigger Kernel Compilation Process
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/../aosp-clang/clang-r522817/bin:$PATH"
          
          # Build target setup
          make O=out surya_defconfig
          
          # Compile using all available virtual cores
          make -j$(nproc --all) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Finished Kernel Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surya-Custom-Kernel
          path: out/arch/arm64/boot/Image.gz-dtb
